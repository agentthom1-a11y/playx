[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playx-dj"
version = "0.3.0b1"
description = "Local-first DJ transition studio and experimental Mixxx agent bridge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["dj", "music", "mixxx", "audio", "transition", "local-first"]
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "librosa>=0.10.2,<1",
  "soundfile>=0.12,<1", "fastapi>=0.110,<1", "uvicorn>=0.29,<1",
  "python-multipart>=0.0.20,<1", "pydantic>=2,<3",
]

[project.optional-dependencies]
midi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]
ai = ["anthropic>=0.40,<1"]
full = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2", "anthropic>=0.40,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1.2,<2", "pip-audit>=2.8,<3"]

[project.scripts]
playx = "playx.cli:main"

[tool.setuptools.packages.find]
include = ["playx*"]

[tool.setuptools.package-data]
playx = ["assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
