[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "playx-dj"
version = "0.1.0"
description = "Local-first agentic DJ"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26","scipy>=1.12","librosa>=0.10.2","soundfile>=0.12","fastapi>=0.110","uvicorn>=0.29","mido>=1.3","python-rtmidi>=1.5","anthropic>=0.40"]
[project.optional-dependencies]
dev = ["pytest>=8","httpx>=0.27"]
[project.scripts]
playx = "playx.cli:main"
[tool.setuptools.packages.find]
include = ["playx*"]
